name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never kill a push run that may be mid-deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: auction-frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: auction-frontend
        run: bun run lint

      - name: Run tests
        working-directory: auction-frontend
        run: bun run test

      - name: Build frontend
        working-directory: auction-frontend
        run: bun run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://auction:auction@localhost:5432/auction
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: auction-backend
        run: bun install --frozen-lockfile

      - name: Compile backend
        working-directory: auction-backend
        run: bun build index.ts --target=bun --outdir=/tmp/assist-club-backend-build

      - name: Apply database schema
        working-directory: auction-backend
        run: bun run src/migrate.ts

      - name: Run tests
        working-directory: auction-backend
        run: bun run test

  deploy:
    name: Deploy
    needs: [frontend, backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ github.ref_name == 'main' && '/home/ubuntu/assistclub-prod' || '/home/ubuntu/assistclub-dev' }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build"