server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so these are safe to
    # cache for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entrypoint, so clients always pick up the latest
    # hashed asset references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes, so serve the app shell
    # and let React Router handle them instead of returning nginx's 404.
    #
    # Do NOT add $uri/ here. If a client-side route shares its name with a real
    # directory in the build output (e.g. /charities vs /images/charities), $uri/
    # matches that directory, nginx looks for an index.html inside it, and
    # returns 403 on refresh instead of falling back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
